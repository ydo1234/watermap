# RPi development and acceptance testing only. VPS releases use deploy/ionos.
services:
  watermap_dev:
    build: .
    image: watermap:dev
    ports:
      - "${WATERMAP_DEV_BIND:-0.0.0.0}:8081:8000"
      - "[${WATERMAP_DEV_BIND_V6:-::1}]:8081:8000"
    env_file:
      - path: .env
        format: raw
    environment:
      FLASK_ENV: development
      WATERMAP_PUBLIC_URL: "${WATERMAP_DEV_PUBLIC_URL:-http://localhost:8081}"
      # Acceptance tests must not send real recovery emails by default.
      MAIL_SUPPRESS_SEND: "${WATERMAP_DEV_MAIL_SUPPRESS_SEND:-true}"
    volumes:
      - .:/app:ro
      - watermap_db_dev:/app/db
      - watermap_pages_dev:/app/pages
      - watermap_uploads_dev:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1200m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/login', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  watermap_db_dev:
  watermap_pages_dev:
  watermap_uploads_dev:
