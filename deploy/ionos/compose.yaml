name: watermap

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: ./source
    image: watermap-ionos:production
    restart: unless-stopped
    env_file:
      - path: ./runtime.env
        format: raw
    ports:
      - "127.0.0.1:8080:8000"
    volumes:
      - ./data/db:/app/db
      - ./data/pages:/app/pages
      - ./data/uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1200m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/_health', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
    logging: *logging

  caddy:
    image: caddy@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 192m
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
